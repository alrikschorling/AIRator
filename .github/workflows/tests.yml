name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Restores the exact package versions recorded in renv.lock
      - uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: Rscript tests/run-tests.R
